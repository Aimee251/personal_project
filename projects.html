<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimee — Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-canvas"></div>
  <div id="grass-container"></div>
  <div id="petals-container"></div>

  <div class="container">
    <a class="back-btn" href="index.html">← Back to Aimee</a>

    <section class="page-header">
      <h1 class="page-title">My <span>Projects</span></h1>
      <p class="page-subtitle">From seeds to fully bloomed products 🌿</p>
    </section>

    <div class="coming-soon">
      <div class="coming-soon-icon">🌿</div>
      <h2>Growing in progress…</h2>
      <p>Projects are being tended to. Check them out on my Devpost!</p>

      <a href="https://devpost.com/ztianyu951"
         target="_blank"
         style="
           display: inline-flex;
           align-items: center;
           gap: 8px;
           padding: 12px 28px;
           background: linear-gradient(135deg, var(--grass-light), var(--grass-deep));
           color: white;
           font-family: 'DM Sans', sans-serif;
           font-size: 0.95rem;
           font-weight: 500;
           text-decoration: none;
           border-radius: 50px;
           box-shadow: 0 4px 20px rgba(44,80,64,0.2);
           transition: transform 0.2s, box-shadow 0.2s;
         "
         onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 28px rgba(44,80,64,0.28)'"
         onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 20px rgba(44,80,64,0.2)'"
      >
        View my Devpost ↗
      </a>

      <a class="back-btn" href="index.html">← Go back home</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
